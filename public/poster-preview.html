<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Póster Promocional Salud360</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      min-height: 100vh;
    }
    .header-bar {
      max-width: 900px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 12px 20px;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .btn {
      background: #0d9488;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover { background: #0f766e; }
    .poster-container {
      max-width: 900px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(13, 148, 136, 0.25);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(45, 212, 191, 0.3);
      background: #090e17;
    }
    .poster-container img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div>
      <h2 style="font-size: 18px; font-weight: 700; color: #fff;">Póster Promocional Salud360</h2>
      <p style="font-size: 13px; color: #94a3b8;">Diseñado para IPS, Clínicas y Centros Médicos</p>
    </div>
    <div style="display: flex; gap: 10px;">
      <a href="poster-salud360.svg" download class="btn">⬇ Descargar SVG Vectorial</a>
      <button onclick="window.print()" class="btn" style="background: #334155;">🖨️ Imprimir / Guardar PDF</button>
    </div>
  </div>

  <div class="poster-container">
    <img src="poster-salud360.svg" alt="Póster Promocional Salud360" />
  </div>
</body>
</html>
